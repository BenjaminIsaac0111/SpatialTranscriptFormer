name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[dev]

    - name: Check formatting with black
      run: |
        black --check .

    - name: Download test data
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Explicit --data-dir: the default comes from config.yaml, which holds a
        # machine-specific Windows path (A:\hest_data). On a Linux runner that is
        # a legal *filename*, so it silently created a directory literally named
        # "A:\hest_data". Use "hest_data" -- it is one of the fallbacks that
        # get_hest_data_dir() searches, so the tests can find the data too.
        python scripts/download_hest.py --id TENX29 --skip-wsis --skip-patches --yes           --data-dir hest_data

    - name: Test with pytest
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pytest tests/
