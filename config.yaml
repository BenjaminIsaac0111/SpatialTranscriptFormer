# SpatialTranscriptFormer Project Configuration
# This file stores global defaults for data paths and training parameters.

# Data Paths
# Candidates for the HEST data directory (checked in order).
#
# Portable, relative entries only. Machine-specific absolute paths belong in
# config.local.yaml (untracked), which is deep-merged over this file. A tracked
# absolute path becomes every contributor's *and* CI's default -- and a Windows
# path such as 'A:\hest_data' is a legal filename on Linux, so it fails
# silently by creating an oddly-named directory instead of erroring.
data_dirs:
  - "hest_data"
  - "../hest_data"

# Training Defaults
training:
  num_genes: 1000
  batch_size: 8
  learning_rate: 0.0001
  output_dir: "./runs"

# MSigDB Pathway Settings
pathways:
  default_collection: "hallmarks"
  cache_dir: ".cache"

# Quality Control Defaults
qc:
  min_umis: 500
  min_genes: 200
  max_mt: 0.15
  min_pathways: 25
