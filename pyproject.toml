[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcript-former"
version = "0.1.0"
description = "A transformer-based model for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "h5py",
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    # Capped at the next major. NOTE: this would NOT have caught the CI break,
    # which was a minor-version tqdm/huggingface-hub interaction inside
    # snapshot_download. The real protection is _resolve_and_fetch() in
    # recipes/hest/download.py, which no longer relies on that code path.
    "tqdm>=4.60,<5",
    "datasets",
    "pyarrow",
    "huggingface-hub>=0.20,<2",
    "matplotlib",
    "seaborn",
    "nystrom-attention",
    "scipy",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "pre-commit",
]

[project.scripts]
stf-download = "spatial_transcript_former.recipes.hest.download:main"
stf-split = "spatial_transcript_former.recipes.hest.splitting:main"
stf-train = "spatial_transcript_former.train:main"
stf-predict = "spatial_transcript_former.predict:main"
stf-extract = "spatial_transcript_former.recipes.hest.extract_features:main"
stf-compute-pathways = "spatial_transcript_former.recipes.hest.compute_pathway_activities:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spatial_transcript_former*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
    "ignore:os.fork:RuntimeWarning",
    # torch.compile perf hint on Ampere+. Deliberately not acted on: TF32 gives
    # ~+23% on fp32 matmuls, but the hot paths (training, feature extraction)
    # run under --use-amp, which is ~2.3x faster still. Enabling TF32 globally
    # would trade precision for a speedup we do not benefit from.
    "ignore:TensorFloat32 tensor cores:UserWarning",
    "ignore:torch.utils._pytree._register_pytree_node is deprecated:UserWarning",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
